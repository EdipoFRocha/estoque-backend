server:
  port: 8080
  forward-headers-strategy: framework

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      connectionInitSql: SET search_path TO mvp_clean, public

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    schemas: mvp_clean
    default-schema: mvp_clean

  jpa:
    hibernate:
      ddl-auto: validate

app:
  jwt:
    secret: ${APP_JWT_SECRET}
    access-ms: ${APP_JWT_ACCESS_MS:86400000}
    refresh-ms: ${APP_JWT_REFRESH_MS:86400000}
  cors:
    origins: ${APP_CORS_ORIGINS}
  cookies:
    secure: true
    same-site: None